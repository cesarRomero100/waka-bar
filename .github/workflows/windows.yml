name: Windows

# Runs only when the Windows app, the shared fixtures or this workflow change.
# Also on pushes to windows/** work branches, to validate them before opening a PR.
on:
  push:
    branches: [main, "windows/**"]
    paths:
      - windows/**
      - shared/**
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - windows/**
      - shared/**
      - .github/workflows/windows.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      # Core and tests get the full check (whitespace, style, analyzers). The WinUI app gets whitespace
      # only: the full check would compile it without its XAML-generated code.
      - name: Check formatting
        run: |
          dotnet format src/WakaBar.Core/WakaBar.Core.csproj --verify-no-changes
          dotnet format tests/WakaBar.Core.Tests/WakaBar.Core.Tests.csproj --verify-no-changes
          dotnet format whitespace src/WakaBar.App --folder --verify-no-changes

      - name: Test
        run: dotnet test tests/WakaBar.Core.Tests/WakaBar.Core.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      # WinUI needs a real platform; x64 is enough to catch build errors.
      - name: Build app
        run: dotnet build src/WakaBar.App/WakaBar.App.csproj --configuration Release -p:Platform=x64
