name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel App Shared Widget

      - name: Generate project
        run: xcodegen

      # No Local.xcconfig in CI: builds with the placeholder IDs from Base.xcconfig, unsigned.
      - name: Build
        run: |
          xcodebuild build \
            -project WakaBar.xcodeproj \
            -scheme WakaBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
