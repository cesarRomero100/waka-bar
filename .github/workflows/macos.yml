name: macOS

# Runs only when the macOS app, the shared fixtures or this workflow change.
on:
  push:
    branches: [main]
    paths:
      - macos/**
      - shared/**
      - .github/workflows/macos.yml
  pull_request:
    paths:
      - macos/**
      - shared/**
      - .github/workflows/macos.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel App Shared Widget Scripts Tests

      - name: Generate project
        run: xcodegen

      # No Local.xcconfig in CI: builds with the placeholder IDs from Base.xcconfig, unsigned.
      # `test` builds the whole scheme (app, widget and tests), so there is no separate build step.
      - name: Build and test
        run: |
          xcodebuild test \
            -project WakaBar.xcodeproj \
            -scheme WakaBar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
