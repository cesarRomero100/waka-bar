name: WakaBar

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

# DEVELOPMENT_TEAM, APP_BUNDLE_ID and APP_GROUP_ID come from Config/Base.xcconfig,
# which includes the git-ignored Config/Local.xcconfig. Don't set them here:
# project.yml settings would override the xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    # Extract user-facing strings into Shared/Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  WakaBar:
    type: application
    platform: macOS
    sources: [App, Shared]
    # Shared scheme, so CI and fresh clones can build without opening Xcode first.
    scheme:
      testTargets: [WakaBarTests]
    dependencies:
      - target: WakaBarWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # The lint script reads every source folder, which the user script sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: swift-format lint
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          if xcrun --find swift-format >/dev/null 2>&1; then
            xcrun swift-format lint --recursive --parallel "$SRCROOT/App" "$SRCROOT/Shared" "$SRCROOT/Widget" "$SRCROOT/Scripts" "$SRCROOT/Tests"
          else
            echo "warning: swift-format not found. Use Xcode 16+ or run: brew install swift-format"
          fi
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WakaBar
        # XcodeGen would otherwise write 1.0 / 1 and ignore MARKETING_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        # wakabar:// links, opened by a click on the widget.
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [wakabar]
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: App/WakaBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  WakaBarWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: WakaBar
        # Must match the app's version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/WakaBarWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # Hostless unit tests: compiles the code under test directly instead of launching the
  # menu bar app, so tests never touch the network, the Keychain or the App Group.
  WakaBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - App/WakaTimeClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
